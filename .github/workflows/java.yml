name: Java file-ring prototype

on:
  pull_request:
    paths:
      - 'java/**'
      - '.github/workflows/java.yml'
  push:
    branches: [java/spsc-mmap]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run bounded process tests
        shell: bash
        run: bash java/scripts/test.sh
